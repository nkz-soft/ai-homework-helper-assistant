[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-homework-helper-assistant"
version = "0.1.0"
description = "Homework helper assistant (LangGraph + MCP)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.14.10",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "mypy==1.19.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = '(?x)(^src/tests/)'