[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-homework-helper-assistant"
version = "0.1.0"
description = "Homework helper assistant (LangGraph + MCP)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "langgraph>=1.0.5",
  "fastapi>=0.110.0",
  "jinja2>=3.1.4",
  "mcp>=1.25.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29.0",
  "pydantic-settings>=2.2.0",
  "cachetools>=5.3.3",
]

[project.optional-dependencies]
dev = [
  "ruff==0.15.9",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "mypy==1.19.1",
  "types-cachetools==6.2.0.20251022",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
exclude = '(?x)(^src/tests/)'
